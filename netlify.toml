[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.12.0"
  PNPM_FLAGS = "--frozen-lockfile"

# Old /cms/ bookmarks keep working without a second editing surface.
[[redirects]]
  from = "/cms"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/cms/*"
  to = "/admin/"
  status = 301
