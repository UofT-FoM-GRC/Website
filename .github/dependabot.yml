version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - '*'
