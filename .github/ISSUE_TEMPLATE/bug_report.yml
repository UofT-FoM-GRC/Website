name: Bug report
description: Report site behavior that is wrong or broken.
title: 'Bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, personal information, or private account details.
  - type: input
    id: page
    attributes:
      label: Page or URL
      description: Where did this happen?
      placeholder: https://uoftfomgrc.ca/example
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome 123 on Windows 11
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or extra context
      description: Drag screenshots here. Remove private information first.
