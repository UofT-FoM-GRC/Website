# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.214.1/schema/sveltia-cms.json
# Sveltia 0.214.1 is pinned for the technical rehearsal. Upgrade only after a new rehearsal.
backend:
  name: github
  repo: UofT-FoM-GRC/Website
  branch: main
  auth_methods: [oauth]

publish_mode: editorial_workflow
site_url: https://uoftfomgrc.ca
editor:
  preview: false
output:
  omit_empty_optional_fields: true
media_folder: public/assets
public_folder: /assets
media_libraries:
  default:
    config:
      # 10 MiB keeps browser-side processing responsive while accepting normal camera exports.
      max_file_size: 10485760
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048

collections:
  - name: blog
    label: Blog Posts
    folder: src/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    identifier_field: title
    summary: '{{title}} — {{pubDate}}'
    sortable_fields: ['pubDate', 'title']
    preview_path: '/blog/{{slug}}/'
    fields:
      - {
          label: Title,
          name: title,
          widget: string,
          hint: Main title. Changing it does not change the URL of an existing post.
        }
      - {
          label: Description,
          name: description,
          widget: text,
          hint: One or two sentences for search and page metadata.
        }
      - {
          label: Publish Date,
          name: pubDate,
          widget: datetime,
          type: date,
          default: '{{now}}',
          format: 'YYYY-MM-DD',
          date_format: 'YYYY-MM-DD',
          time_format: false
        }
      - { label: Updated Date, name: updatedDate, widget: hidden }
      - {
          label: Publication Status,
          name: status,
          widget: select,
          options: [current, archived],
          default: current,
          hint: Archive time-limited or superseded posts. Archived posts remain available at their existing URL.
        }
      - {
          label: Expires On,
          name: expiresOn,
          widget: datetime,
          required: false,
          type: date,
          format: 'YYYY-MM-DD',
          date_format: 'YYYY-MM-DD',
          time_format: false,
          hint: Optional Toronto date through which the post stays in current listings. It remains at its URL and changes at the next site build.
        }
      - {
          label: Hero Image,
          name: heroImage,
          widget: image,
          required: false,
          accept: 'image/jpeg,image/png,image/webp',
          hint: 'Optional banner. JPEG, PNG, and WebP uploads become optimized WebP files in /assets.'
        }
      - {
          label: Hero Image Description,
          name: heroImageAlt,
          widget: string,
          required: false,
          hint: Describe the image. Required whenever a hero image is supplied.
        }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        min: 1
        max: 3
        hint: Select one to three categories. These control related resource pages.
        options:
          - { label: Employment, value: employment }
          - { label: Career Planning & Exploration, value: career-planning-exploration }
          - { label: Continuing Education, value: continuing-education }
          - { label: Health & Wellness, value: health-wellness }
          - { label: Housing, value: housing }
          - { label: 'Scholarships, Bursaries & Awards', value: scholarships-bursaries-awards }
          - { label: Scholarship/Award/Grant Application Support, value: scholarship-award-grant-application-support }
          - { label: Other, value: other }
      - {
          label: Body,
          name: body,
          widget: richtext,
          modes: [rich_text],
          buttons: [heading-two, heading-three, heading-four, bold, italic, link, bulleted-list, numbered-list],
          editor_components: [accessible-image, callout, action-link],
          allow_nested_components: false,
          sanitize_preview: true,
          use_markdown_shortcuts: false,
          hint: 'Main post content. Use Insert to add accessible images, callouts, and action links.'
        }
  - name: resources
    label: Resource Pages
    format: json
    preview_path: '/resources/{{slug}}/'
    files:
      - name: employment
        label: Employment Resources
        file: src/data/resources/employment.json
        preview_path: '/resources/{{slug}}/'
        fields: &typed_resource_fields
          - &resource_slug { label: Stable URL ID, name: slug, widget: hidden }
          - &resource_title { label: Page Heading, name: title, widget: string }
          - &resource_description {
              label: Page Description,
              name: description,
              widget: text,
              hint: One or two sentences for search and page metadata.
            }
          - &resource_card_title {
              label: Resource Card Title,
              name: cardTitle,
              widget: string,
              hint: Text on the Resources landing-page card.
            }
          - &resource_card_image {
              label: Resource Card Image,
              name: cardImage,
              widget: image,
              required: true,
              accept: 'image/jpeg,image/png,image/webp'
            }
          - &resource_card_image_alt {
              label: Resource Card Image Description,
              name: cardImageAlt,
              widget: string,
              required: true
            }
          - label: Page Sections
            name: sections
            widget: list
            summary: '{{title}}'
            hint: Reorder sections and cards by dragging. A new section keeps the in-page link created from its first heading.
            fields:
              - &section_id { label: Section Anchor, name: id, widget: hidden }
              - &section_title { label: Section Heading, name: title, widget: string }
              - &section_intro {
                  label: Introductory Paragraphs,
                  name: intro,
                  widget: list,
                  required: false,
                  field: { label: Paragraph, name: paragraph, widget: text }
                }
              - &section_columns { label: Cards Per Row, name: columns, widget: select, options: [1, 2, 3], default: 1 }
              - &section_status {
                  label: Visibility,
                  name: status,
                  widget: select,
                  options: [current, archived],
                  default: current,
                  hint: 'Archived sections leave quick navigation and search. They keep their heading, a required notice, and an optional replacement link.'
                }
              - &section_archive_notice {
                  label: Archive Notice,
                  name: archiveNotice,
                  widget: text,
                  required: false,
                  hint: Required when this section is archived.
                }
              - &section_replacement
                label: Optional Replacement Link
                name: replacement
                widget: object
                required: false
                fields:
                  - { label: Link Text, name: label, widget: string, required: false }
                  - { label: Destination URL, name: url, widget: string, required: false }
              - label: Cards
                name: cards
                widget: list
                summary: '{{title}}'
                required: false
                min: 0
                fields:
                  - { label: Card Heading, name: title, widget: string }
                  - {
                      label: Card Layout,
                      name: variant,
                      widget: select,
                      options: [card, plain],
                      default: card,
                      required: false
                    }
                  - {
                      label: Card Visibility,
                      name: status,
                      widget: select,
                      options: [current, archived],
                      default: current,
                      hint: Archived cards remain stored but are not shown to visitors.
                    }
                  - label: Card Content
                    name: blocks
                    widget: list
                    summary: '{{type}}'
                    required: false
                    min: 0
                    hint: Add and reorder the information on this card.
                    types:
                      - name: text
                        label: Formatted text
                        widget: object
                        fields:
                          - {
                              label: Text,
                              name: body,
                              widget: richtext,
                              modes: [rich_text],
                              buttons: [bold, italic, link, bulleted-list],
                              editor_components: [],
                              allow_nested_components: false,
                              sanitize_preview: true,
                              use_markdown_shortcuts: false
                            }
                      - name: image
                        label: Image
                        widget: object
                        fields:
                          - {
                              label: Image,
                              name: image,
                              widget: image,
                              required: true,
                              accept: 'image/jpeg,image/png,image/webp'
                            }
                          - { label: Image Description, name: imageAlt, widget: string, required: true }
                      - name: links
                        label: Links and actions
                        widget: object
                        fields:
                          - {
                              label: Appearance,
                              name: appearance,
                              widget: select,
                              options: [link, button],
                              default: link
                            }
                          - label: Destinations
                            name: items
                            widget: list
                            fields:
                              - { label: Link Text, name: label, widget: string }
                              - {
                                  label: Destination URL,
                                  name: url,
                                  widget: string,
                                  hint: 'Include https:// for external links, mailto: for email, or tel: for telephone.'
                                }
                      - name: steps
                        label: Steps
                        widget: object
                        fields:
                          - {
                              label: List Style,
                              name: listStyle,
                              widget: select,
                              options: [unordered, ordered],
                              default: unordered
                            }
                          - label: Items
                            name: items
                            widget: list
                            fields:
                              - { label: Step Text, name: text, widget: string }
                              - label: Step Links
                                name: links
                                widget: list
                                required: false
                                fields:
                                  - { label: Link Text, name: label, widget: string }
                                  - { label: Destination URL, name: url, widget: string }
                              - {
                                  label: Nested Items,
                                  name: items,
                                  widget: list,
                                  required: false,
                                  field: { label: Item, name: item, widget: string }
                                }
                      - name: contact
                        label: Contact details
                        widget: object
                        fields:
                          - {
                              label: Address Lines,
                              name: addressLines,
                              widget: list,
                              required: false,
                              field: { label: Address Line, name: line, widget: string }
                            }
                          - label: Labelled Values
                            name: facts
                            widget: list
                            required: false
                            fields:
                              - { label: Label, name: label, widget: string, hint: 'Example: Phone:' }
                              - { label: Value, name: value, widget: string }
                              - { label: Optional Destination URL, name: url, widget: string, required: false }
                      - name: contact-panels
                        label: Contact panels
                        widget: object
                        fields:
                          - label: Panels
                            name: panels
                            widget: list
                            fields:
                              - { label: Panel Heading, name: title, widget: string }
                              - {
                                  label: Paragraphs,
                                  name: text,
                                  widget: list,
                                  required: false,
                                  field: { label: Paragraph, name: paragraph, widget: text }
                                }
                              - {
                                  label: Address Lines,
                                  name: addressLines,
                                  widget: list,
                                  required: false,
                                  field: { label: Address Line, name: line, widget: string }
                                }
                              - label: Labelled Contact Details
                                name: facts
                                widget: list
                                required: false
                                fields:
                                  - { label: Label, name: label, widget: string }
                                  - { label: Value, name: value, widget: string }
                                  - { label: Optional Destination URL, name: url, widget: string, required: false }
                              - label: Links
                                name: links
                                widget: list
                                required: false
                                fields:
                                  - { label: Link Text, name: label, widget: string }
                                  - { label: Destination URL, name: url, widget: string }
                      - name: callout
                        label: Callout
                        widget: object
                        fields:
                          - {
                              label: Callout Kind,
                              name: kind,
                              widget: select,
                              options:
                                [
                                  { label: Information, value: information },
                                  { label: Important, value: important },
                                  { label: Warning, value: warning }
                                ],
                              default: information
                            }
                          - { label: Optional Heading, name: title, widget: string, required: false }
                          - {
                              label: Callout Message,
                              name: body,
                              widget: richtext,
                              required: true,
                              modes: [rich_text],
                              buttons: [bold, italic, link, bulleted-list, numbered-list],
                              editor_components: [],
                              allow_nested_components: false,
                              sanitize_preview: true,
                              use_markdown_shortcuts: false
                            }
      - name: career-planning-exploration
        label: Career Planning & Exploration Resources
        file: src/data/resources/career-planning-exploration.json
        preview_path: '/resources/{{slug}}/'
        fields: *typed_resource_fields
      - name: continuing-education
        label: Continuing Education
        file: src/data/resources/continuing-education.json
        preview_path: '/resources/{{slug}}/'
        fields: *typed_resource_fields
      - name: health-wellness
        label: Health & Wellness
        file: src/data/resources/health-wellness.json
        preview_path: '/resources/{{slug}}/'
        fields: *typed_resource_fields
      - name: housing
        label: Housing
        file: src/data/resources/housing.json
        preview_path: '/resources/{{slug}}/'
        fields: *typed_resource_fields
      - name: other
        label: Miscellaneous Resources
        file: src/data/resources/other.json
        preview_path: '/resources/{{slug}}/'
        fields: *typed_resource_fields
      - name: scholarships-bursaries-awards
        label: Scholarships, Bursaries & Awards
        file: src/data/resources/scholarships-bursaries-awards.json
        preview_path: '/resources/{{slug}}/'
        fields: *typed_resource_fields
      - name: scholarship-award-grant-application-support
        label: Application Support Resources
        file: src/data/resources/scholarship-award-grant-application-support.json
        preview_path: '/resources/{{slug}}/'
        fields: *typed_resource_fields
  - name: homepage_announcements
    label: Homepage Announcements
    files:
      - label: Homepage Announcements
        name: announcements
        file: src/data/announcements.json
        preview_path: '/'
        fields:
          - label: Announcements
            name: items
            widget: list
            hint: Only active announcements appear below the homepage hero. Drag to set display order.
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Message, name: text, widget: text }
              - { label: Optional Link URL, name: url, widget: string, required: false }
              - { label: Show on Homepage, name: active, widget: boolean, default: false }
  - name: homepage
    label: Homepage
    files:
      - label: Homepage
        name: homepage
        file: src/data/homepage.json
        preview_path: '/'
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - {
                  label: Hero Image,
                  name: image,
                  widget: image,
                  required: true,
                  accept: 'image/jpeg,image/png,image/webp'
                }
              - { label: Hero Image Description, name: imageAlt, widget: string, required: true }
              - {
                  label: Hero Lines,
                  name: lines,
                  widget: list,
                  min: 2,
                  max: 5,
                  hint: The second line is the main page heading. Keep it descriptive.,
                  field: { label: Line, name: line, widget: string }
                }
          - label: Feature Sections
            name: featureSections
            widget: list
            fields:
              - { label: Heading, name: title, widget: string }
              - {
                  label: Paragraphs,
                  name: paragraphs,
                  widget: list,
                  field: { label: Paragraph, name: paragraph, widget: text }
                }
              - label: Links
                name: links
                widget: list
                required: false
                fields:
                  [
                    { label: Link Text, name: label, widget: string },
                    { label: Destination URL, name: url, widget: string }
                  ]
              - { label: Image, name: image, widget: image, required: true, accept: 'image/jpeg,image/png,image/webp' }
              - { label: Image Description, name: imageAlt, widget: string, required: true }
              - { label: Background Tone, name: tone, widget: select, options: [dark, light] }
              - { label: Put Image First on Desktop, name: imageFirst, widget: boolean, default: false }
          - { label: Contact Heading, name: contactHeading, widget: string }
          - { label: Contact Text, name: contactText, widget: text }
  - name: team_and_about
    label: Team and About Page
    files:
      - label: About Page and Team Archive
        name: team
        file: src/data/team.json
        preview_path: '/about/'
        fields:
          - label: About Page
            name: about
            widget: object
            fields:
              - { label: Page Title, name: title, widget: string }
              - { label: Introduction, name: description, widget: text }
              - {
                  label: Hero Image,
                  name: heroImage,
                  widget: image,
                  required: true,
                  accept: 'image/jpeg,image/png,image/webp'
                }
              - { label: Hero Image Description, name: heroImageAlt, widget: string, required: true }
              - { label: Purpose Heading, name: purposeTitle, widget: string }
              - {
                  label: Purpose Paragraphs,
                  name: purposeParagraphs,
                  widget: list,
                  field: { label: Paragraph, name: paragraph, widget: text }
                }
              - {
                  label: Objectives,
                  name: objectives,
                  widget: list,
                  field: { label: Objective, name: objective, widget: string }
                }
              - { label: Work Heading, name: workTitle, widget: string }
              - {
                  label: Work Paragraphs,
                  name: workParagraphs,
                  widget: list,
                  field: { label: Paragraph, name: paragraph, widget: text }
                }
          - label: Team Years
            name: years
            widget: list
            hint: First year displays first. Add past years here; ordering is preserved.
            fields:
              - { label: Academic Year, name: year, widget: string, hint: 'Example: 2025 - 2026.' }
              - {
                  label: Current Team,
                  name: current,
                  widget: boolean,
                  default: false,
                  hint: Select exactly one current team year.
                }
              - label: Members
                name: members
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Position, name: position, widget: string }
                  - {
                      label: Photo,
                      name: image,
                      widget: image,
                      required: false,
                      accept: 'image/jpeg,image/png,image/webp'
                    }
                  - {
                      label: Photo Description,
                      name: imageAlt,
                      widget: string,
                      required: false,
                      hint: Required whenever a photo is supplied.
                    }
  - name: advanced_site_settings
    label: Advanced Site Settings
    files:
      - label: Navigation
        name: navigation
        file: src/data/navigation.json
        preview_path: '/'
        fields:
          - { label: Header Brand, name: brand, widget: string }
          - label: Main Navigation Links
            name: links
            widget: list
            fields: [{ label: Label, name: label, widget: string }, { label: URL, name: url, widget: string }]
          - { label: Resources Menu Label, name: resourceLabel, widget: string }
          - label: Resources Menu Links
            name: resourceLinks
            widget: list
            min: 8
            max: 8
            fields:
              [
                { label: Label, name: label, widget: string },
                {
                  label: Resource Page,
                  name: slug,
                  widget: select,
                  options:
                    [
                      { label: Employment, value: employment },
                      { label: Career Planning & Exploration, value: career-planning-exploration },
                      { label: Continuing Education, value: continuing-education },
                      { label: Health & Wellness, value: health-wellness },
                      { label: Housing, value: housing },
                      { label: 'Scholarships, Bursaries & Awards', value: scholarships-bursaries-awards },
                      {
                        label: Scholarship/Award/Grant Application Support,
                        value: scholarship-award-grant-application-support
                      },
                      { label: Other, value: other }
                    ]
                }
              ]
      - label: Contact and Social Links
        name: site
        file: src/data/site.json
        preview_path: '/'
        fields:
          - { label: Site Title, name: title, widget: string }
          - { label: Site Description, name: description, widget: text }
          - label: Contact
            name: contact
            widget: object
            fields: [{ label: Public Email Address, name: email, widget: string }]
          - label: Social Links
            name: socialLinks
            widget: list
            fields:
              - { label: Accessible Label, name: label, widget: string }
              - {
                  label: Destination URL,
                  name: url,
                  widget: string,
                  hint: 'Include https:// for external links, / for internal links, mailto: for email, or tel: for telephone.',
                  pattern:
                    [
                      '^(?:https?://|mailto:|tel:|/(?!/)|#)',
                      'Use an https URL, mailto:, tel:, site-relative URL, or fragment.'
                    ]
                }
              - { label: Network, name: network, widget: select, options: [instagram, github] }
